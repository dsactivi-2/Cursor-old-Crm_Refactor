name: Join - Deploy to staging

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Staging

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Setup AWS CLI
      uses: unfor19/install-aws-cli-action@master

    - name: Login to ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ECR_REGISTRY_URL }}
        username: ${{ secrets.AWS_ACCESS_KEY_ID }}
        password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: .
        file: ./docker/join/Dockerfile
        target: release
        tags: ${{ secrets.ECR_JOIN_REPO }}:staging

    - name : Restart pods
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" >> $HOME/.kube/config
        kubectl config use-context ${{ secrets.CLUSTER_NAME }}
        kubectl rollout restart deployment join-deployment
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
