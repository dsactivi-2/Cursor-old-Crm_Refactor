name: Cron - Deploy to production

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set tag and version environment variables
      run: |
        echo "CRON_TAG=$GITHUB_REF" >> $GITHUB_ENV
        export CRON_VERSION=$(echo $GITHUB_REF | sed -e 's/.*\/cron\/v//g')
        echo "CRON_VERSION=$CRON_VERSION" >> $GITHUB_ENV

    - name: Get tag and version environment variables
      run: |
        echo "CRON_TAG is ${{ env.CRON_TAG }}"
        echo "CRON_VERSION is ${{ env.CRON_VERSION }}"

    - name: Ensure a valid tag is being used
      run: >
        if [[ ! $CRON_TAG =~ .*cron/v[0-9]+\.[0-9]+\.[0-9a-zA-Z\-]+$ ]]; then
            echo "Tag $CRON_TAG doesn't match the required pattern .*cron/v[0-9]+\.[0-9]+\.[0-9].*$";
            exit 1;
        fi

    - name: Setup AWS CLI
      uses: unfor19/install-aws-cli-action@master

    - name: Login to ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ECR_REGISTRY_URL }}
        username: ${{ secrets.AWS_ACCESS_KEY_ID }}
        password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: .
        file: ./docker/crm-cron/Dockerfile
        target: release
        tags: ${{ secrets.ECR_CRON_REPO }}:${{ env.CRON_VERSION }}

    - name : Restart pods
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" >> $HOME/.kube/config
        kubectl config use-context ${{ secrets.CLUSTER_NAME }}
        cd kubernetes/production/legacy-crm/
        kubectl apply -f cron.yaml
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
