<VirtualHost *:80>
    DocumentRoot /var/www/html/jobstep_pp
    DirectoryIndex dashboard.php
    AccessFileName .htaccess
    ServerName ${JS_SERVER_NAME}

    RewriteEngine On
    RewriteRule ^/jobstep_pp(/.*)?$ ${JS_URL}$1 [R=307,L]

    <Directory />
      Options Indexes FollowSymLinks
      AllowOverride All
      Require all granted
      AddType application/x-httpd-php .php
    </Directory>

    <Directory /var/www/html/jobstep_pp>
      Options Indexes FollowSymLinks
      AllowOverride All
      Require all granted
      AddType application/x-httpd-php .php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler  "proxy:unix:/run/php/php7.1-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    <Proxy "fcgi://localhost/" enablereuse=on max=10>
    </Proxy>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

</VirtualHost>
